<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>النظام المحاسبي</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b 55%,#273449);display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{position:relative;background:linear-gradient(135deg,#111c33,#1e2a44);border-radius:18px;padding:34px 30px;width:360px;max-width:92vw;box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 0 1px rgba(214,174,56,.25);text-align:center;overflow:hidden}
.bg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:0;font-family:Arial,Helvetica,sans-serif;font-weight:900;letter-spacing:-.08em;font-size:200px;line-height:1;background:linear-gradient(135deg,#fae082,#d6ae38 55%,#a0781e);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.9;pointer-events:none;user-select:none;white-space:nowrap}
.inner{position:relative;z-index:1}
.logo{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,#d6ae38,#a0781e);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 14px}
h2{margin:0 0 4px;font-size:20px;color:#fff}
p.sub{margin:0 0 20px;font-size:12px;color:#cbd5e1}
.field{text-align:right;margin-bottom:12px}
label{display:block;font-size:12px;color:#e2e8f0;margin-bottom:4px}
input{width:100%;padding:11px 12px;border:1px solid rgba(214,174,56,.45);border-radius:10px;font-size:14px;background:rgba(255,255,255,.07);color:#fff;box-sizing:border-box}
input:focus{outline:none;border-color:#d6ae38;box-shadow:0 0 0 3px rgba(214,174,56,.2)}
.err{color:#fda4af;font-size:12px;min-height:16px;margin-bottom:6px}
button{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#fae082,#d6ae38 55%,#a0781e);color:#1a1206;font-size:15px;font-weight:800;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.load{display:none;color:#cbd5e1;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <div class="bg">HB</div>
  <div class="inner">
    <div class="logo">🔒</div>
    <h2>النظام المحاسبي</h2>
    <p class="sub">الملف محمي ومُشفّر — أدخل كلمة السر لفتحه</p>
    <div class="field"><label>كلمة السر</label><input id="p" type="password" autocomplete="off" onkeydown="if(event.key==='Enter')go()"></div>
    <div class="err" id="e"></div>
    <button id="b" onclick="go()">🔓 فتح</button>
    <div class="load" id="l">… جارٍ فك التشفير والتحميل</div>
  </div>
</div>
